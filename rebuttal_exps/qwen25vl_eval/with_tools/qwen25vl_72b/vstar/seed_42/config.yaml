  tool_selection: Point,OCR,Crop,AStarWithPixelCoordinate
  resume_from_ckpt:
    vstar: /data/songmingyang/code/reasoning/AdaReasoner-rebuttal/rebuttal_exps/qwen25vl_eval/with_tools/qwen25vl_72b/vstar/seed_42/ckpt.jsonl
  save_to_ckpt:
    vstar: /data/songmingyang/code/reasoning/AdaReasoner-rebuttal/rebuttal_exps/qwen25vl_eval/with_tools/qwen25vl_72b/vstar/seed_42/ckpt.jsonl
  middle_images_save_dir:
    vstar: /data/songmingyang/code/reasoning/AdaReasoner-rebuttal/rebuttal_exps/qwen25vl_eval/with_tools/qwen25vl_72b/vstar/seed_42/middle_images
script_args:
  verbosity: INFO
  output_path: /data/songmingyang/code/reasoning/AdaReasoner-rebuttal/rebuttal_exps/qwen25vl_eval/with_tools/qwen25vl_72b/vstar/seed_42/result.jsonl
  controller_addr: http://127.0.0.1:21112

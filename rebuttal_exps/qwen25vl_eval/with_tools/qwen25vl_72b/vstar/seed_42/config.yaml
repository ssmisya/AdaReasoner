model_args:
  model: openai
  model_args: pretrained=Qwen2.5-VL-72B-Instruct,temperature=0.0,limit_mm_per_prompt=10,max_retry=5,tensor_parallel=1
  batch_size: 1
  max_rounds: 6
  model_mode: general
task_args:
